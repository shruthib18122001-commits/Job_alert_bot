name: 🎓 2027 New Grad Job Alert

on:
  schedule:
    # Runs every hour at minute 0
    #- cron: "0 * * * *"
  # Allow manual trigger from the GitHub UI
  workflow_dispatch:

permissions:
  contents: write   # needed to commit seen_jobs.json back to repo

jobs:
  check-jobs:
    name: Check for new grad postings
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo (with full history so we can push) ──────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run the checker ───────────────────────────────────────────────
      - name: Run job checker
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python checker.py

      # ── 5. Commit updated seen_jobs.json (if changed) ────────────────────
      - name: Commit updated seen_jobs.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --cached --quiet || git commit -m "chore: update seen_jobs [skip ci]"
          git push
